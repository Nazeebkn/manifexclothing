{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .otp-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
        .otp-container h2 {
            margin-bottom: 10px;
        }
        .otp-container p {
            margin-bottom: 20px;
            color: #666;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .otp-inputs input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        .otp-inputs input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .verify-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .verify-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .resend {
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .messages .success {
            color: #28a745;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .messages .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        #timer {
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h2>OTP Verification</h2>
        <p>Enter the 4-digit code sent to your email: {{ email }}</p>
        <div id="timer">Time remaining: 1:00</div>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST" action="{% url 'verify_otp' %}" autocomplete="off" id="otp-form">
            {% csrf_token %}
            <div class="otp-inputs">
                <input type="text" name="otp_1" maxlength="1" required>
                <input type="text" name="otp_2" maxlength="1" required>
                <input type="text" name="otp_3" maxlength="1" required>
                <input type="text" name="otp_4" maxlength="1" required>
            </div>
            <button type="submit" class="verify-btn" id="verify-btn">Verify OTP</button>
        </form>
        <a href="{% url 'resend_otp' %}" class="resend" id="resend-link">Resend OTP</a>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer logic
        const expiresAt = {{ otp_expires_at|default:0 }} * 1000; // Convert to milliseconds
        const timerDisplay = document.getElementById('timer');
        const verifyBtn = document.getElementById('verify-btn');
        const resendLink = document.getElementById('resend-link');
        const form = document.getElementById('otp-form');

        function updateTimer() {
            const now = Date.now();
            const timeLeft = expiresAt - now;

            if (timeLeft <= 0) {
                timerDisplay.textContent = 'OTP has expired';
                verifyBtn.disabled = true;
                resendLink.style.pointerEvents = 'auto';
                resendLink.style.opacity = '1';
                clearInterval(timerInterval);
            } else {
                const seconds = Math.floor(timeLeft / 1000);
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                timerDisplay.textContent = `Time remaining: ${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
                verifyBtn.disabled = false;
                resendLink.style.pointerEvents = 'none';
                resendLink.style.opacity = '0.5';
            }
        }

        if (expiresAt) {
            const timerInterval = setInterval(updateTimer, 1000);
            updateTimer(); // Initial call to avoid 1-second delay
        } else {
            timerDisplay.textContent = 'OTP not available';
            verifyBtn.disabled = true;
            resendLink.style.pointerEvents = 'auto';
            resendLink.style.opacity = '1';
        }
    </script>
</body>
</html>
