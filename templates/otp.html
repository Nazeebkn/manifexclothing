
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta namerobot: noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .otp-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
        .otp-container h2 {
            margin-bottom: 10px;
        }
        .otp-container p {
            margin-bottom: 20px;
            color: #666;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .otp-inputs input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        .otp-inputs input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .verify-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .resend {
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .messages .success {
            color: #28a745;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .messages .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h2>OTP Verification</h2>
        <p>Enter the 4-digit code sent to your email: {{ email }}</p>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST" action="{% url 'verify_otp' %}" autocomplete="off" >
            {% csrf_token %}
            <div class="otp-inputs">
                <input type="text" name="otp_1" maxlength="1" required>
                <input type="text" name="otp_2" maxlength="1" required>
                <input type="text" name="otp_3" maxlength="1" required>
                <input type="text" name="otp_4" maxlength="1" required>

            </div>
            <button type="submit" class="verify-btn">Verify OTP</button>
        </form>
        <a href="{% url 'resend_otp' %}" class="resend">Resend OTP</a>
    </div>

    <script>
        const inputs = document.querySelectorAll('.otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
