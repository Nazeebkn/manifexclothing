{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Suruchi - Payment</title>
    <meta name="description" content="Payment Page">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'assets/css/plugins/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/plugins/glightbox.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }
        .payment-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 50px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .payment-section:hover {
            transform: translateY(-5px);
        }
        .payment-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #2c3e50, #3498db);
        }
        .payment-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #2c3e50, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .order-info {
            margin-bottom: 35px;
            background: #f9fbfc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(52, 152, 219, 0.2);
        }
        .order-info h3 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        .order-info h3::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 50px;
            height: 3px;
            background: #3498db;
            border-radius: 3px;
        }
        .order-info p {
            font-size: 1.5rem;
            color: #555;
            margin: 8px 0;
            line-height: 1.7;
            transition: color 0.3s ease;
        }
        .order-info p:hover {
            color: #3498db;
        }
        .order-info p strong {
            color: #2c3e50;
            font-weight: 600;
        }
        .btn-proceed {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1.6rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            background: linear-gradient(90deg, #2c3e50, #34495e);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-proceed:hover {
            background: linear-gradient(90deg, #34495e, #2c3e50);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .btn-proceed::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.5s ease;
        }
        .btn-proceed:hover::after {
            left: 100%;
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .payment-section {
                padding: 30px;
            }
            .payment-title {
                font-size: 2.2rem;
            }
            .order-info h3 {
                font-size: 1.6rem;
            }
            .order-info p {
                font-size: 1.3rem;
            }
            .btn-proceed {
                width: 100%;
                text-align: center;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div id="ctn-preloader" class="ctn-preloader">
            <div class="animation-preloader">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <main class="main__content_wrapper">
        <section class="payment-section">
            <div class="container">
                <h2 class="payment-title">Payment Details</h2>
                <div class="order-info">
                    <h3>Order Summary</h3>
                    <p><strong>Subtotal:</strong> ₹{{ total|floatformat:2 }}</p>
                    <!-- <p><strong>Total Amount:</strong> ₹{{ order_data.totale_pric|floatformat:2 }}</p> -->
                    <p><strong>Name:</strong> {{ name }}</p>
                    <p><strong>Email:</strong> {{ email }}</p>
                    <p><strong>Contact:</strong> {{ contact }}</p>
                    <p><strong>Date:</strong> {% if order_data.created_at %}{{ order_data.created_at|date:"F j, Y" }}{% else %}{% now "F j, Y" %}{% endif %}</p>
                </div>
                <button class="btn-proceed" id="proceed-to-pay">Proceed to Pay</button>
            </div>
        </section>
    </main>

    <button id="scroll__top"><svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M112 244l144-144 144 144M256 120v292"/></svg></button>

    <!-- Load Razorpay Checkout JS -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // Function to get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // Log initial values for debugging
        console.log('Razorpay Key:', '{{ razorpay_key_id }}');
        console.log('Order ID:', '{{ razorpay_order_id }}');
        console.log('Amount:', {{ amount }});
        console.log('CSRF Token:', csrftoken);

        document.getElementById('proceed-to-pay').addEventListener('click', function(e) {
            e.preventDefault();
            var options = {
                "key": "{{ razorpay_key_id }}",
                "amount": {{ amount }},
                "currency": "{{ currency }}",
                "name": "Suruchi",
                "description": "Order Payment",
                "order_id": "{{ razorpay_order_id }}",
                "handler": function (response) {
                    console.log('Payment Response:', response); // Log Razorpay response
                    fetch('/verify-payment/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken
                        },
                        body: JSON.stringify({
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    })
                    .then(response => {
                        console.log('Fetch Response Status:', response.status); // Log HTTP status
                        if (!response.ok) {
                            throw new Error('Network response was not ok: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Server Response:', data); // Log server response
                        if (data.success) {
                            console.log('Redirecting to:', '/success/' + data.order_id + '/');
                            window.location.href = '/success/' + data.order_id + '/';
                        } else {
                            console.log('Redirecting to failure page');
                            window.location.href = '/order-failure/';
                        }
                    })
                    .catch(error => {
                        console.error('Fetch Error:', error); // Log any fetch errors
                        window.location.href = '/order-failure/';
                    });
                },
                "prefill": {
                    "name": "{{ name }}",
                    "email": "{{ email }}",
                    "contact": "{{ contact }}"
                },
                "theme": {
                    "color": "#2c3e50"
                },
                "modal": {
                    "ondismiss": function() {
                        console.log('Payment modal dismissed'); // Log dismissal
                        window.location.href = '/order-failure/';
                    }
                }
            };
            var rzp = new Razorpay(options);
            rzp.on('payment.failed', function (response) {
                console.log('Payment Failed:', response); // Log failure
                window.location.href = '/order-failure/';
            });
            rzp.open();
        });
    </script>

    <script src="{% static 'assets/js/vendor/popper.js' %}" defer="defer"></script>
    <script src="{% static 'assets/js/vendor/bootstrap.min.js' %}" defer="defer"></script>
    <script src="{% static 'assets/js/plugins/swiper-bundle.min.js' %}" defer></script>
    <script src="{% static 'assets/js/plugins/glightbox.min.js' %}" defer></script>
    <script src="{% static 'assets/js/script.js' %}" defer></script>
</body>
</html>
