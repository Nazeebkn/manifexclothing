{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login__section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .account__login {
            background: #fff;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .account__login--header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .account__login--input {
            border: 1px solid #ced4da;
            border-radius: 5px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            font-size: 1rem;
        }
        .account__login--btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s;
            background-color: #dc3545; /* Default button color */
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .account__login--btn:hover {
            background-color: #c82333; /* Hover effect (slightly darker shade) */
        }
        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none; /* Hidden by default, shown with JS */
        }
        input.error + .error-message {
            display: block; /* Show error message when input has error class */
        }
        .messages .success {
            color: #28a745;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .messages .error {
            color: #dc3545;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .back-to-login {
            text-align: center;
            margin-top: 1rem;
        }
        .back-to-login a {
            color: #007bff;
            text-decoration: none;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
        @media (max-width: 767px) {
            .brand-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login__section">
        <div class="account__login">
            <div class="account__login--header">
                <h1>Reset Your Password</h1>
            </div>
            <p>Enter your new password.</p>
            
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            
            <form id="reset-password-form" method="post" action="{% url 'reset_password' email=email %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input 
                        type="password" 
                        id="password"  
                        name="password" 
                        class="account__login--input" 
                        placeholder="Enter new password" 
                        required
                    >
                    <span class="error-message">Password 8 characters long aavanam</span>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm_password"  
                        name="confirm_password" 
                        class="account__login--input" 
                        placeholder="Confirm new password" 
                        required
                    >
                    <span class="error-message">Passwords match cheyyunnilla</span>
                </div>
                <button type="submit" class="account__login--btn">Reset Password</button>
            </form>
            
            <div class="back-to-login">
                <a href="{% url 'login' %}">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('reset-password-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        
        form.addEventListener('submit', function(e) {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (password.length < 8) {
                e.preventDefault();
                passwordInput.classList.add('error');
            } else if (password !== confirmPassword) {
                e.preventDefault();
                confirmPasswordInput.classList.add('error');
            } else {
                passwordInput.classList.remove('error');
                confirmPasswordInput.classList.remove('error');
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                this.classList.remove('error');
            }
        });

        confirmPasswordInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                this.classList.remove('error');
            }
        });
    </script>
</body>
</html>
