{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login__section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .account__login {
            background: #fff;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .account__login--header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .account__login--input {
            border: 1px solid #ced4da;
            border-radius: 5px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            font-size: 1rem;
        }
        .account__login--btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s;
            background-color: #dc3545; /* Default button color */
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .account__login--btn:hover {
            background-color: #dc3545; /* Hover effect */
        }
        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none; /* Hidden by default, shown with JS */
        }
        input.error + .error-message {
            display: block; /* Show error message when input has error class */
        }
        .messages .success {
            color: #28a745;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .messages .error {
            color: #dc3545;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .back-to-login {
            text-align: center;
            margin-top: 1rem;
        }
        .back-to-login a {
            color: #007bff;
            text-decoration: none;
        }
        .back-to-login a:hover {
            text-decoration: underline;
        }
        @media (max-width: 767px) {
            .brand-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login__section">
        <div class="account__login">
            <div class="account__login--header">
                <h1>Forgot Your Password?</h1>
            </div>
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <p>Enter your email address and we'll send you an OTP to reset your password.</p>
            
            <form id="forgot-password-form" method="post" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email"  
                        name="email" 
                        class="account__login--input" 
                        placeholder="Enter your email" 
                        required
                    >
                    <span class="error-message">Please enter a valid email address</span>
                </div>
                <button type="submit" class="account__login--btn">Send OTP</button>
            </form>
            <div class="back-to-login">
                <a href="{% url 'login' %}">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgot-password-form');
        const emailInput = document.getElementById('email');
        
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        form.addEventListener('submit', function(e) {
            const email = emailInput.value.trim();
            if (!validateEmail(email)) {
                e.preventDefault();
                emailInput.classList.add('error');
            } else {
                emailInput.classList.remove('error');
            }
        });

        emailInput.addEventListener('input', function() {
            if (this.classList.contains('error')) {
                this.classList.remove('error');
            }
        });
    </script>
</body>
</html>
